name: Release

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        !contains(github.event.workflow_run.head_commit.message || '', '[skip ci]') &&
        !contains(github.event.workflow_run.head_commit.message || '', '[ci skip]')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Project
        uses: pixpilot/github-actions/setup-pnpm-project@v1

      - name: Build dist
        run: npm run bundle

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  notify:
    name: Notify Telegram
    needs: release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification action
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Report release outcome
        uses: ./
        with:
          status: >-
            ${{ github.event.workflow_run.conclusion == 'success' && needs.release.result || github.event.workflow_run.conclusion }}
          notify-on: any
          message: >-
            CI: ${{ github.event.workflow_run.conclusion }};
            release job: ${{ needs.release.result }}.
            Source CI run: ${{ github.event.workflow_run.html_url }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
